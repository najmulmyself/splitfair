name: splitfair
description: Bill Splitter & Tip Calculator — Free, Fair, No Signup
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── CORE LOGIC ──────────────────────────────────────────────
  decimal: ^3.2.4
  intl: ^0.20.2
  collection: ^1.18.0

  # ── STATE MANAGEMENT ────────────────────────────────────────
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # ── LOCAL STORAGE ───────────────────────────────────────────
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── NAVIGATION ──────────────────────────────────────────────
  go_router: ^17.2.3

  # ── UI & ANIMATION ──────────────────────────────────────────
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.1.0

  # ── SHARING & EXPORT ────────────────────────────────────────
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  url_launcher: ^6.3.0

  # ── ADMOB ───────────────────────────────────────────────────
  google_mobile_ads: ^7.0.0

  # ── IN-APP PURCHASE ─────────────────────────────────────────
  in_app_purchase: ^3.2.0

  # ── UTILITIES ───────────────────────────────────────────────
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^3.0.0-dev.11
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/data/
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/SF-Pro-Rounded-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Rounded-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Text-Medium.otf
          weight: 500
